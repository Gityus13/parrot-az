<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Səhifə tapılmadı | PARROT-AZ</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#070b11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#070b11;
    --cyan:#35d7ff;
    --cyan-dim:#1c8fac;
    --text:#e8eef4;
    --text-dim:#9fb0c2;
    --border:rgba(130,190,220,0.14);
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-mono);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:1.5rem;
    background-image:
      linear-gradient(rgba(90,160,190,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,160,190,0.05) 1px, transparent 1px);
    background-size:42px 42px;
  }
  .wrap{max-width:520px;}
  .code{
    font-family:var(--font-display);
    font-size:clamp(4rem,14vw,7rem);
    font-weight:700;
    color:var(--cyan);
    text-shadow:0 0 32px rgba(53,215,255,0.35);
    letter-spacing:-0.02em;
    line-height:1;
  }
  .msg{
    margin-top:1rem;
    font-family:var(--font-display);
    font-size:1.3rem;
    font-weight:600;
    color:var(--text);
  }
  .sub{
    margin-top:.75rem;
    color:var(--text-dim);
    font-size:.95rem;
    line-height:1.6;
  }
  .prompt{
    margin-top:2rem;
    display:inline-block;
    border:1px solid var(--border);
    border-radius:6px;
    padding:.9rem 1.2rem;
    font-size:.85rem;
    color:var(--cyan-dim);
    text-align:left;
  }
  .prompt span{color:var(--cyan);}
  a.btn{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    margin-top:2rem;
    padding:.8rem 1.6rem;
    border-radius:6px;
    background:var(--cyan);
    color:#04121a;
    font-family:var(--font-display);
    font-weight:600;
    font-size:.9rem;
    text-decoration:none;
    transition:box-shadow .2s ease;
  }
  a.btn:hover{box-shadow:0 0 0 1px var(--cyan), 0 0 28px -4px rgba(53,215,255,0.65);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">Bu səhifə tapılmadı</p>
    <p class="sub">Axtardığınız keçid mövcud deyil və ya köçürülüb — sanki bir CTF flag-i kimi gizlənib.</p>
    <div class="prompt">$ curl -I <span>parrotaz.site/bu-sehife</span><br>HTTP/1.1 404 Not Found</div>
    <br>
    <a class="btn" href="./">← Ana səhifəyə qayıt</a>
  </div>
</body>
</html>
